# Builds Dream Download Manager on GitHub's computers, for Linux and Windows.
#
# Runs on every push, and when started by hand (Actions > Build > Run
# workflow). The results are under the run's "Artifacts":
#   dreamdm-linux    .deb (Ubuntu, Debian, Mint), .rpm (Fedora) and .tar.gz
#   dreamdm-windows  DreamDM-Setup-<version>.exe
# Pushing a tag like v0.9.0 also attaches them to a GitHub release.
#
# The version comes from gui/build/windows/info.json (fixed.file_version).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach files to a release, for tags

env:
  WAILS_VERSION: v3.0.0-beta.34 # keep in step with gui/go.mod

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (engine, manager, video, bridge...)
        run: go test ./...

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux libraries the window needs (GTK and WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails and nfpm (the package builder)
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Version
        run: echo "VERSION=$(jq -r .fixed.file_version gui/build/windows/info.json)" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: gui
        run: |
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          (cd frontend && npm install && npm run build)
          CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o ../dist/linux/dreamdm .

      - name: Build the browser helper
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-w -s" -o dist/linux/dlm-host ./cmd/dlm-host

      - name: Packages
        run: |
          nfpm package -f installer/linux/nfpm.yaml -p deb -t dist/
          nfpm package -f installer/linux/nfpm.yaml -p rpm -t dist/
          # A plain archive too, for other distributions.
          mkdir -p dist/tar/dreamdm
          cp dist/linux/dreamdm dist/linux/dlm-host LICENSE installer/linux/dreamdm.desktop installer/linux/dreamdm.png dist/tar/dreamdm/
          cp -r extension dist/tar/dreamdm/
          tar -C dist/tar -czf "dist/dreamdm-${VERSION}-linux-amd64.tar.gz" dreamdm
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dreamdm-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build the app
        working-directory: gui
        run: wails3 build

      - name: Build the browser helper
        run: go build -trimpath -ldflags="-s -w" -o gui/bin/dlm-host.exe ./cmd/dlm-host

      - name: Setup file (NSIS)
        shell: pwsh
        run: |
          $version = (Get-Content gui/build/windows/info.json -Raw | ConvertFrom-Json).fixed.file_version
          New-Item -ItemType Directory -Force dist | Out-Null
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location installer/windows
          & $makensis /V2 "/DVERSION=$version" DreamDM.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: dreamdm-windows
          path: dist/*.exe

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
