# nfpm.yaml - builds the Linux packages (.deb for Ubuntu/Debian/Mint, .rpm
# for Fedora/openSUSE) from the files the build put in dist/linux.
# Used by .github/workflows/build.yml:  nfpm package -f installer/linux/nfpm.yaml -p deb
#
# Everything goes in /opt/dreamdm (the program, the browser helper, the
# extension's files), with a "dreamdm" command, a menu entry and an icon.
# The browser helper's manifests go where Chrome, Chromium and Edge look for
# them system-wide, so the extension works for every user.

name: dreamdm
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: KLAH
description: |
  Dream Download Manager: a free, open-source download manager with no ads.
  Multi-connection downloads that resume, video sites, subtitles, browser
  catching, schedules and themes.
license: GPL-3.0-or-later

# The window libraries: set by the build from what the program links to
# (GTK 4 + WebKitGTK 6.0 for current Wails; GTK 3 + WebKitGTK 4.1 before).
depends:
  - ${DEB_GTK}
  - ${DEB_WEBKIT}
overrides:
  rpm:
    depends:
      - ${RPM_GTK}
      - ${RPM_WEBKIT}

contents:
  - src: dist/linux/dreamdm
    dst: /opt/dreamdm/dreamdm
    file_info: { mode: 0755 }
  - src: dist/linux/dlm-host
    dst: /opt/dreamdm/dlm-host
    file_info: { mode: 0755 }
  # The extension's files, listed by kind with their folders made
  # explicitly: readable by everyone (Chrome runs as the user, not root).
  # Copying the folder as one lump left its icons folder unreadable.
  - dst: /opt/dreamdm
    type: dir
    file_info: { mode: 0755 }
  - dst: /opt/dreamdm/extension
    type: dir
    file_info: { mode: 0755 }
  - dst: /opt/dreamdm/extension/icons
    type: dir
    file_info: { mode: 0755 }
  - src: extension/*.json
    dst: /opt/dreamdm/extension/
    file_info: { mode: 0644 }
  - src: extension/*.js
    dst: /opt/dreamdm/extension/
    file_info: { mode: 0644 }
  - src: extension/*.html
    dst: /opt/dreamdm/extension/
    file_info: { mode: 0644 }
  - src: extension/*.css
    dst: /opt/dreamdm/extension/
    file_info: { mode: 0644 }
  - src: extension/icons/*.png
    dst: /opt/dreamdm/extension/icons/
    file_info: { mode: 0644 }
  - src: /opt/dreamdm/dreamdm
    dst: /usr/bin/dreamdm
    type: symlink
  - src: installer/linux/dreamdm.desktop
    dst: /usr/share/applications/dreamdm.desktop
  - src: installer/linux/dreamdm.png
    dst: /usr/share/icons/hicolor/256x256/apps/dreamdm.png
  - src: LICENSE
    dst: /usr/share/doc/dreamdm/copyright
  # The browser extension's helper (cmd/dlm-host), for every user.
  - src: installer/linux/com.dlmanager.host.json
    dst: /etc/opt/chrome/native-messaging-hosts/com.dlmanager.host.json
  - src: installer/linux/com.dlmanager.host.json
    dst: /etc/chromium/native-messaging-hosts/com.dlmanager.host.json
  - src: installer/linux/com.dlmanager.host.json
    dst: /etc/opt/edge/native-messaging-hosts/com.dlmanager.host.json
